[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-python"
version = "0.1.0"
description = "A Python/Django autonomous coding orchestration service"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "Django>=5.2,<6",
  "httpx>=0.28,<1",
  "Jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "structlog>=25.1,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "pytest-cov>=6,<7",
  "pytest-django>=4.10,<5",
  "ruff>=0.11,<1",
]

[project.scripts]
tempo = "tempo.cli:main"

[tool.setuptools.packages.find]
include = ["tempo*", "tempo_web*"]

[tool.setuptools.package-data]
tempo_web = ["templates/*.html", "templates/includes/*.html", "static/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tempo_web.settings"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
