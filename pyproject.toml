[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-python"
version = "0.1.0"
description = "A Python/Django autonomous coding orchestration service"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

[project.scripts]
tempo = "tempo.cli:main"

[tool.setuptools.packages.find]
include = ["tempo*", "tempo_web*"]

[tool.setuptools.package-data]
tempo_web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tempo_web.settings"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
