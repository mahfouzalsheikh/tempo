services:
  tempo:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${TEMPO_PORT:-8030}:8000"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-development-only}"
      TEMPO_JWT_ACCESS_TTL_SECONDS: "${TEMPO_JWT_ACCESS_TTL_SECONDS:-28800}"
      TEMPO_JWT_COOKIE_SECURE: "${TEMPO_JWT_COOKIE_SECURE:-false}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REVIEW_TOKEN: "${GITHUB_REVIEW_TOKEN:-${GITHUB_TOKEN:-}}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TEMPO_LOG_LEVEL: "${TEMPO_LOG_LEVEL:-INFO}"
      TEMPO_TIME_ZONE: "${TEMPO_TIME_ZONE:-UTC}"
      TEMPO_WORKSPACE_ROOT: /data/workspaces
      TEMPO_RUNTIME_BACKEND: docker
      TEMPO_AGENT_STATE_ROOT: /data/agent-state
      TEMPO_PREVIEW_ROOT: /data/previews
      TEMPO_PREVIEW_PORT: "${TEMPO_PREVIEW_PORT:-8031}"
      TEMPO_RELEASE_ROOT: /data/releases
      TEMPO_RELEASE_PORT: "${TEMPO_RELEASE_PORT:-8032}"
      TEMPO_ACCEPTANCE_IMAGE: "${TEMPO_ACCEPTANCE_IMAGE:-}"
      TEMPO_DATABASE_PATH: /data/database/tempo.sqlite3
      DATABASE_URL: "postgresql://tempo:${TEMPO_POSTGRES_PASSWORD:-tempo-local}@postgres:5432/tempo"
      TEMPO_ADMIN_USERNAME: "${TEMPO_ADMIN_USERNAME:-}"
      TEMPO_ADMIN_PASSWORD: "${TEMPO_ADMIN_PASSWORD:-}"
      TEMPO_ADMIN_EMAIL: "${TEMPO_ADMIN_EMAIL:-}"
      DOCKER_HOST: tcp://project-runner:2375
      TEMPO_VALIDATION_RUNNER_URL: http://validation-runner:8787
      TEMPO_VALIDATION_IMAGE: "${TEMPO_VALIDATION_IMAGE:-}"
      TEMPO_VALIDATION_RUNNER_TOKEN: "${TEMPO_VALIDATION_RUNNER_TOKEN:?Run python3 scripts/provision-runner-token.py first}"
    volumes:
      - ./WORKFLOW.md:/app/WORKFLOW.md:ro
      - tempo-workspaces:/data/workspaces
      - tempo-agent-state:/data/agent-state
      - tempo-database:/data/database
      - tempo-previews:/data/previews
      - tempo-releases:/data/releases
      # Import credentials as root during container startup, then run Tempo as its
      # unprivileged user with state stored in a container-owned volume. A direct
      # bind mount is not writable when the host and container UIDs differ.
      - "${HOME}/.codex:/run/tempo-host-codex:ro"
      - tempo-codex:/home/tempo/.codex
    depends_on:
      postgres:
        condition: service_healthy
      project-runner:
        condition: service_healthy
      validation-runner:
        condition: service_healthy

  preview-server:
    build:
      context: .
      dockerfile: Dockerfile.preview
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # Namespace firewall setup only; the entrypoint drops all capabilities and UID
    # before starting the static server. A normal bridge is needed for port publishing.
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/run:size=1m,mode=0755,noexec,nosuid"]
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
    ports:
      - "127.0.0.1:${TEMPO_PREVIEW_PORT:-8031}:8080"
    environment:
      TEMPO_PREVIEW_ROOT: /data/previews
      TEMPO_PREVIEW_PORT: "${TEMPO_PREVIEW_PORT:-8031}"
    volumes:
      - tempo-previews:/data/previews:ro
    networks: [preview-ingress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  release-server:
    build:
      context: .
      dockerfile: Dockerfile.release
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/run:size=1m,mode=0755,noexec,nosuid"]
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
    ports:
      - "127.0.0.1:${TEMPO_RELEASE_PORT:-8032}:8080"
    environment:
      TEMPO_RELEASE_ROOT: /data/releases
      TEMPO_RELEASE_PORT: "${TEMPO_RELEASE_PORT:-8032}"
    volumes:
      - tempo-releases:/data/releases:ro
    networks: [release-ingress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  acceptance-worker:
    image: tempo-tempo:latest
    entrypoint: ["python", "/app/manage.py", "acceptance_worker"]
    user: "10001:10001"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://tempo:${TEMPO_POSTGRES_PASSWORD:-tempo-local}@postgres:5432/tempo"
      DOCKER_HOST: tcp://project-runner:2375
      TEMPO_WORKSPACE_ROOT: /data/workspaces
      TEMPO_ACCEPTANCE_IMAGE: "${TEMPO_ACCEPTANCE_IMAGE:-}"
      TEMPO_PREVIEW_ROOT: /data/previews
      TEMPO_PREVIEW_PORT: "${TEMPO_PREVIEW_PORT:-8031}"
    volumes:
      - tempo-workspaces:/data/workspaces
      - tempo-previews:/data/previews:ro
    networks: [default, preview-ingress]
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time() - Path('/tmp/acceptance-heartbeat').stat().st_mtime < 200"]
      interval: 10s
      timeout: 3s
      retries: 3

  release-worker:
    build:
      context: .
      dockerfile: Dockerfile.release-worker
    entrypoint: ["python", "/app/manage.py", "release_worker"]
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=4m,mode=1777,noexec,nosuid"]
    pids_limit: 32
    mem_limit: 512m
    cpus: 1
    environment:
      DATABASE_URL: "postgresql://tempo:${TEMPO_POSTGRES_PASSWORD:-tempo-local}@postgres:5432/tempo"
      TEMPO_PREVIEW_ROOT: /data/previews
      TEMPO_PREVIEW_PORT: "${TEMPO_PREVIEW_PORT:-8031}"
      TEMPO_RELEASE_ROOT: /data/releases
      TEMPO_RELEASE_PORT: "${TEMPO_RELEASE_PORT:-8032}"
    volumes:
      - tempo-releases:/data/releases
      - tempo-previews:/data/previews:ro
    networks: [release-control, release-ingress]
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time() - Path('/tmp/release-heartbeat').stat().st_mtime < 240"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    networks: [default, release-control]
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: "${TEMPO_POSTGRES_PASSWORD:-tempo-local}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo -d tempo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tempo-postgres:/var/lib/postgresql/data

  validation-runner:
    build:
      context: .
    entrypoint: ["python", "-m", "tempo.validation_server"]
    user: "10001:10001"
    restart: unless-stopped
    environment:
      TEMPO_WORKSPACE_ROOT: /data/workspaces
      TEMPO_VALIDATION_BACKEND: docker
      TEMPO_VALIDATION_IMAGE: "${TEMPO_VALIDATION_IMAGE:-}"
      TEMPO_VALIDATION_RUNNER_TOKEN: "${TEMPO_VALIDATION_RUNNER_TOKEN:?Run python3 scripts/provision-runner-token.py first}"
      DOCKER_HOST: tcp://project-runner:2375
    depends_on:
      project-runner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tempo-workspaces:/data/workspaces

  project-runner:
    build:
      context: .
      dockerfile: Dockerfile.execution
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--dns=1.1.1.1", "--dns=8.8.8.8"]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/tempo-execution-daemon", "--check"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tempo-workspaces:/data/workspaces
      - tempo-agent-state:/data/agent-state

volumes:
  tempo-workspaces:
  tempo-database:
  tempo-codex:
  tempo-postgres:
  tempo-agent-state:
  tempo-previews:
  tempo-releases:

networks:
  preview-ingress:
  release-ingress:
  release-control:
    internal: true
