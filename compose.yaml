services:
  tempo:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${TEMPO_PORT:-8030}:8000"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-development-only}"
      TEMPO_JWT_ACCESS_TTL_SECONDS: "${TEMPO_JWT_ACCESS_TTL_SECONDS:-28800}"
      TEMPO_JWT_COOKIE_SECURE: "${TEMPO_JWT_COOKIE_SECURE:-false}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REVIEW_TOKEN: "${GITHUB_REVIEW_TOKEN:-${GITHUB_TOKEN:-}}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TEMPO_LOG_LEVEL: "${TEMPO_LOG_LEVEL:-INFO}"
      TEMPO_TIME_ZONE: "${TEMPO_TIME_ZONE:-UTC}"
      TEMPO_WORKSPACE_ROOT: /data/workspaces
      TEMPO_DATABASE_PATH: /data/database/tempo.sqlite3
      DATABASE_URL: "postgresql://tempo:${TEMPO_POSTGRES_PASSWORD:-tempo-local}@postgres:5432/tempo"
      TEMPO_ADMIN_USERNAME: "${TEMPO_ADMIN_USERNAME:-}"
      TEMPO_ADMIN_PASSWORD: "${TEMPO_ADMIN_PASSWORD:-}"
      TEMPO_ADMIN_EMAIL: "${TEMPO_ADMIN_EMAIL:-}"
      DOCKER_HOST: tcp://project-runner:2375
      TEMPO_VALIDATION_RUNNER_URL: http://validation-runner:8787
      TEMPO_VALIDATION_RUNNER_TOKEN: "${TEMPO_VALIDATION_RUNNER_TOKEN:?Run python3 scripts/provision-runner-token.py first}"
    volumes:
      - ./WORKFLOW.md:/app/WORKFLOW.md:ro
      - tempo-workspaces:/data/workspaces
      - tempo-database:/data/database
      # Import credentials as root during container startup, then run Tempo as its
      # unprivileged user with state stored in a container-owned volume. A direct
      # bind mount is not writable when the host and container UIDs differ.
      - "${HOME}/.codex:/run/tempo-host-codex:ro"
      - tempo-codex:/home/tempo/.codex
    depends_on:
      postgres:
        condition: service_healthy
      project-runner:
        condition: service_healthy
      validation-runner:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: "${TEMPO_POSTGRES_PASSWORD:-tempo-local}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo -d tempo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tempo-postgres:/var/lib/postgresql/data

  validation-runner:
    build:
      context: .
    entrypoint: ["python", "-m", "tempo.validation_server"]
    user: "10001:10001"
    restart: unless-stopped
    environment:
      TEMPO_WORKSPACE_ROOT: /data/workspaces
      TEMPO_VALIDATION_RUNNER_TOKEN: "${TEMPO_VALIDATION_RUNNER_TOKEN:?Run python3 scripts/provision-runner-token.py first}"
      DOCKER_HOST: tcp://project-runner:2375
    depends_on:
      project-runner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tempo-workspaces:/data/workspaces

  project-runner:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tempo-workspaces:/data/workspaces

volumes:
  tempo-workspaces:
  tempo-database:
  tempo-codex:
  tempo-postgres:
